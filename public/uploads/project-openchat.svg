<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="OpenChat">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#15151a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- chat bubbles -->
  <g font-family="JetBrains Mono, monospace" font-size="13">
    <rect x="80" y="80" width="220" height="50" rx="14" fill="#f6f3ec"/>
    <text x="100" y="110" fill="#0b0b0d">hey, are you around?</text>

    <rect x="480" y="150" width="240" height="50" rx="14" fill="#5fc9c2"/>
    <text x="500" y="180" fill="#0b0b0d">yes — typing now ✎</text>

    <rect x="80" y="220" width="280" height="50" rx="14" fill="#f6f3ec"/>
    <text x="100" y="250" fill="#0b0b0d">can you push the build?</text>

    <rect x="440" y="290" width="280" height="50" rx="14" fill="#f5b454"/>
    <text x="460" y="320" fill="#0b0b0d" font-weight="700">deploying · ✓ live</text>

    <rect x="80" y="360" width="180" height="40" rx="14" fill="#f6f3ec"/>
    <text x="100" y="385" fill="#0b0b0d">ship it 🚀</text>
  </g>
  <circle cx="720" cy="100" r="6" fill="#5fc9c2">
    <animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="60" font-family="JetBrains Mono, monospace" font-size="11" fill="#5fc9c2" letter-spacing="3">PROJECT · 02</text>
  <text x="40" y="470" font-family="Fraunces, serif" font-size="34" fill="#f6f3ec" font-style="italic">OpenChat · Realtime</text>
</svg>