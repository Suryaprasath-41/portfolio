<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Student Feedback System">
  <defs>
    <linearGradient id="bg3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#efeae0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <!-- form mock -->
  <g transform="translate(120 90)">
    <rect width="560" height="320" fill="#ffffff" stroke="#0b0b0d" stroke-opacity=".15"/>
    <rect width="560" height="40" fill="#0b0b0d"/>
    <circle cx="20" cy="20" r="5" fill="#c1573a"/>
    <circle cx="38" cy="20" r="5" fill="#f5b454"/>
    <circle cx="56" cy="20" r="5" fill="#5fc9c2"/>
    <text x="80" y="25" font-family="JetBrains Mono, monospace" font-size="11" fill="#f6f3ec">feedback.vsbec.edu.in</text>
    <!-- form fields -->
    <g font-family="Geist, sans-serif" fill="#0b0b0d">
      <text x="30" y="80" font-size="13" font-weight="600">Course</text>
      <rect x="30" y="92" width="240" height="32" fill="#f6f3ec" stroke="#0b0b0d" stroke-opacity=".2"/>
      <text x="42" y="113" font-size="12">CSBS · Semester V</text>

      <text x="30" y="150" font-size="13" font-weight="600">Rating</text>
      <g transform="translate(30 160)">
        <text x="0" y="18" font-size="22" fill="#f5b454">★★★★☆</text>
      </g>

      <text x="30" y="220" font-size="13" font-weight="600">Comments</text>
      <rect x="30" y="232" width="500" height="60" fill="#f6f3ec" stroke="#0b0b0d" stroke-opacity=".2"/>
      <text x="42" y="252" font-size="12" fill="#0b0b0d" opacity=".6">Loved the project module — would like more backend depth…</text>

      <rect x="430" y="232" width="100" height="32" fill="#0b0b0d"/>
      <text x="480" y="253" font-size="11" font-family="JetBrains Mono, monospace" fill="#f5b454" text-anchor="middle" font-weight="700">SUBMIT</text>
    </g>
  </g>
  <text x="40" y="60" font-family="JetBrains Mono, monospace" font-size="11" fill="#c1573a" letter-spacing="3">PROJECT · 03</text>
  <text x="40" y="470" font-family="Fraunces, serif" font-size="34" fill="#0b0b0d" font-style="italic">Student Feedback</text>
</svg>