  </g>
  <text x="40" y="60" font-family="JetBrains Mono, monospace" font-size="11" fill="#c1573a" letter-spacing="3">PROJECT · 08</text>
  <text x="40" y="470" font-family="Fraunces, serif" font-size="30" fill="#f6f3ec" font-style="italic">AI Resume Insight System</text>
