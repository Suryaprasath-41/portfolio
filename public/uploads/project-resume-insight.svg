<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="AI Resume Insight System">
  <defs>
    <linearGradient id="bg8" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#1a1a1d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg8)"/>
  <!-- resume doc -->
  <g transform="translate(120 80)">
    <rect width="240" height="340" fill="#f6f3ec"/>
    <rect x="20" y="24" width="160" height="14" fill="#0b0b0d"/>
    <rect x="20" y="50" width="100" height="8" fill="#0b0b0d" opacity=".4"/>
    <line x1="20" y1="80" x2="220" y2="80" stroke="#0b0b0d" stroke-opacity=".15"/>
    <g fill="#0b0b0d" font-family="Geist, sans-serif">
      <text x="20" y="108" font-size="11" font-weight="700">EXPERIENCE</text>
      <rect x="20" y="120" width="200" height="6" fill="#0b0b0d" opacity=".3"/>
      <rect x="20" y="132" width="180" height="6" fill="#0b0b0d" opacity=".3"/>
      <rect x="20" y="144" width="190" height="6" fill="#0b0b0d" opacity=".3"/>
      <text x="20" y="178" font-size="11" font-weight="700">SKILLS</text>
      <rect x="20" y="190" width="60" height="6" fill="#0b0b0d" opacity=".3"/>
      <rect x="86" y="190" width="80" height="6" fill="#0b0b0d" opacity=".3"/>
      <rect x="172" y="190" width="48" height="6" fill="#0b0b0d" opacity=".3"/>
    </g>
  </g>
  <!-- arrow -->
  <g stroke="#c1573a" stroke-width="3" fill="none">
    <path d="M380 250 L500 250" stroke-linecap="round"/>
