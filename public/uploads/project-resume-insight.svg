    <g font-family="Geist, sans-serif" font-size="11" fill="#0b0b0d">
      <text x="20" y="74">· 3 yrs backend</text>
      <text x="20" y="94">· Python / Node.js</text>
      <text x="20" y="114">· REST + MySQL</text>
